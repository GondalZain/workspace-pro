<aside class="admin-sidebar" aria-label="Company Admin Menu">
  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <div class="section-label">MAIN MENU</div>

    <a [routerLink]="url.admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill">
      <div class="pill-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <span class="pill-label">Overview</span>
    </a>

    <a [routerLink]="url.adminProjects" routerLinkActive="active" class="nav-pill">
      <div class="pill-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <span class="pill-label">Projects</span>
    </a>

    <a [routerLink]="url.adminTasks" routerLinkActive="active" class="nav-pill">
      <div class="pill-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
          <path d="M9 14l2 2 4-4"/>
        </svg>
      </div>
      <span class="pill-label">Tasks</span>
    </a>

    <a [routerLink]="url.adminUsers" routerLinkActive="active" class="nav-pill">
      <div class="pill-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <span class="pill-label">Users &amp; Accounts</span>
      @if (userCount() > 0) {
        <span class="pill-badge">{{ userCount() }}</span>
      }
    </a>

    <a [routerLink]="url.adminRoles" routerLinkActive="active" class="nav-pill">
      <div class="pill-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <span class="pill-label">Roles &amp; Permissions</span>
      @if (roleCount() > 0) {
        <span class="pill-badge alt">{{ roleCount() }}</span>
      }
    </a>

    <a [routerLink]="url.adminStatuses" routerLinkActive="active" class="nav-pill">
      <div class="pill-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
      </div>
      <span class="pill-label">Task Statuses</span>
    </a>

    <a [routerLink]="url.adminFormTemplates" routerLinkActive="active" class="nav-pill">
      <div class="pill-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <span class="pill-label">Form Templates</span>
    </a>

    <a [routerLink]="url.adminSubscription" routerLinkActive="active" class="nav-pill">
      <div class="pill-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
      </div>
      <span class="pill-label">Subscription &amp; Billing</span>
    </a>

    <div class="section-label">QUICK MANAGEMENT</div>

    <a [routerLink]="url.adminUserCreate" routerLinkActive="active" class="nav-pill action-pill">
      <div class="pill-icon add-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
      </div>
      <span class="pill-label">Create User Account</span>
    </a>

    <a [routerLink]="url.adminNewRole" routerLinkActive="active" class="nav-pill action-pill">
      <div class="pill-icon add-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
      <span class="pill-label">Create New Role</span>
    </a>
  </nav>

  <!-- Footer Logout Button -->
  <div class="sidebar-footer">
    <button type="button" class="logout-btn" (click)="logout()" title="Sign out of Admin Console">
      <div class="logout-icon-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>
      <span>Log Out</span>
    </button>
  </div>
</aside>
