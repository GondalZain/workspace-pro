<nav class="user-nav" aria-label="User Workspace Navigation">
  <a [routerLink]="url.dashboardProjects" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="nav-tab">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18v10H3z"/><path d="M8 7V5h8v2"/><path d="M8 12h8"/></svg>
    <span>Projects</span>
  </a>
  <a [routerLink]="url.dashboardTasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="nav-tab">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span>Tasks</span>
  </a>
  <a [routerLink]="url.dashboardCalendar" routerLinkActive="active" class="nav-tab">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>Calendar Schedule</span>
  </a>
  <a [routerLink]="url.dashboardTimesheet" routerLinkActive="active" class="nav-tab">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    <span>Time Sheet</span>
  </a>

  <!-- Dynamic AI Assessment Tab when test comes for the user -->
  @if (pendingAssessments().length > 0) {
    <button
      type="button"
      class="nav-tab nav-tab--assessment"
      (click)="openPendingAssessment(pendingAssessments()[0])"
      title="You have a pending AI Technical Assessment to complete!"
    >
      <span class="nav-tab-pulse-dot"></span>
      <span class="nav-tab-sparkle">✨</span>
      <span>Assessment</span>
      <span class="nav-tab-badge">{{ pendingAssessments().length }}</span>
    </button>
  }
</nav>

<!-- Test Runner Modal -->
<app-developer-test-runner
  [assessmentId]="activeAssessmentId()"
  [initialAssessment]="activeAssessment()"
  [isOpen]="showModal()"
  (close)="closeModal()"
  (completed)="onAssessmentCompleted($event)"
/>
