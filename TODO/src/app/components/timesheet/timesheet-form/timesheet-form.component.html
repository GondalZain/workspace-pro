<div class="timesheet-form-container">
  <div class="timesheet-form-header" [class.align-left]="buttonAlign === 'left' || alignLeft">
    <button type="button" class="btn-add-entry" (click)="toggleForm()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>{{ isOpen() ? 'Close Entry Form' : 'Add Timesheet Entry' }}</span>
    </button>
  </div>

  @if (isOpen()) {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="timesheet-card-form">
    <div class="form-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </svg>
      <span>Log Time Entry</span>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label for="title">Title *</label>
        <input id="title" type="text" formControlName="title" placeholder="e.g. Feature Implementation"
          [class.is-invalid]="form.get('title')?.touched && form.get('title')?.invalid" />
        @if (form.get('title')?.touched && form.get('title')?.invalid) {
        <span class="error-msg">Title is required</span>
        }
      </div>

      <div class="form-group">
        <label for="project">Project (Optional)</label>
        <select id="project" class="form-select" formControlName="project" (change)="onProjectChange($event)">
          <option value="">No project</option>
          @for (p of projects(); track p.id) {
          <option [value]="p.title">{{ p.title }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="task">Task (Optional)</label>
        <select id="task" class="form-select" formControlName="task">
          <option value="">Select task...</option>
          @for (t of filteredTasks(); track t.id) {
          <option [value]="t.title">{{ t.title }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label>Time Spent *</label>
        <div class="time-duration-row">
          <div class="time-input-group">
            <input id="hours" type="number" formControlName="hours" min="0" max="999"
              [class.is-invalid]="showTimeError()" />
            <span class="time-unit">hrs</span>
          </div>
          <div class="time-input-group">
            <input id="minutes" type="number" formControlName="minutes" min="0" max="59"
              [class.is-invalid]="showTimeError()" />
            <span class="time-unit">mins</span>
          </div>
        </div>
        @if (showTimeError()) {
        <span class="error-msg">Please enter hours or minutes</span>
        }
      </div>

      <div class="form-group">
        <label for="date">Date</label>
        <input id="date" type="date" formControlName="date" />
      </div>

      <div class="form-group full-width">
        <label for="description">Description</label>
        <textarea id="description" rows="2" formControlName="description"
          placeholder="Brief details about work performed..."></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn-submit">
        <span>Save Entry</span>
      </button>
    </div>
  </form>
  }
</div>
