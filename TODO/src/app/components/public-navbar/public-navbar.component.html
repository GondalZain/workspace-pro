<header class="app-header">
  <div class="brand-group">
    <a routerLink="/" class="brand-link">
      <div class="brand-logo-badge">
        <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z" />
          <path d="M2 17l10 5 10-5" />
          <path d="M2 12l10 5 10-5" />
        </svg>
      </div>
      <span class="brand-title">Workspace Pro</span>
    </a>
  </div>

  <nav class="nav-links">
    <a routerLink="/" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/pricing" class="nav-link" routerLinkActive="active">Pricing</a>
  </nav>

  <div class="header-actions">
    <a [routerLink]="buttonLink" class="join-btn">{{ buttonText }}</a>
  </div>
</header>
