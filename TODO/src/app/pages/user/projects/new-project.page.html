<app-workspace-user-layout
  sectionId="project-create-page"
  heroBadge="Projects"
  heroTitle="New project"
  heroSubtitle="Add a name, description, and optional cover image to launch your workspace."
  [heroCompact]="true"
>
  <app-project-page-chrome currentLabel="New project" />

  <div class="project-create-wrap">
    <!-- MODE SELECTOR TABS -->
    <div class="creation-mode-tabs" role="tablist">
      <button
        type="button"
        role="tab"
        class="mode-tab-btn"
        [class.active]="creationMode() === 'manual'"
        (click)="creationMode.set('manual')"
      >
        <span class="mode-tab-icon">✍️</span>
        <div class="mode-tab-text">
          <span class="mode-tab-title">Manual Setup</span>
          <span class="mode-tab-desc">Standard blank project configuration</span>
        </div>
      </button>

      <button
        type="button"
        role="tab"
        class="mode-tab-btn"
        [class.active]="creationMode() === 'ai'"
        (click)="creationMode.set('ai')"
      >
        <span class="mode-tab-icon">✨</span>
        <div class="mode-tab-text">
          <span class="mode-tab-title">AI SRS Generator</span>
          <span class="mode-tab-desc">Auto-generate tasks &amp; dependencies from document</span>
        </div>
      </button>
    </div>

    @if (creationMode() === 'manual') {
      <main class="form-main-card">
        <app-project-form
          formHeading="Project details"
          formSubtitle="Fill in title, description, and upload a cover banner image."
          [(imagePreview)]="imagePreview"
          [errorMessage]="errorMessage()"
          submitLabel="Create project"
          (submitted)="createProject($event)"
          (cancelled)="goBack()"
        />
      </main>
    } @else {
      <main class="form-main-card ai-generator-card">
        <app-ai-srs-generator-modal
          [inline]="true"
          mode="new-project"
          (projectCreated)="onAiProjectCreated($event)"
          (cancelled)="goBack()"
        />
      </main>
    }
  </div>
</app-workspace-user-layout>
